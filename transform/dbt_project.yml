name: thameswood
version: "1.0.0"
config-version: 2

profile: thameswood

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  thameswood:
    staging:
      # Views: the staging layer is a typed, cleaned lens over raw. It holds no
      # data of its own, so there is nothing to store and nothing to refresh.
      +materialized: view
    intermediate:
      # Also views. These are working steps, not deliverables -- nothing outside
      # the project should query them, so there is no reason to pay to store
      # them. Kept as models rather than CTEs so each step can be tested.
      +materialized: view
    marts:
      +materialized: table

# Every business decision that a non-engineer might reasonably want to change
# lives here rather than buried in SQL. Each one is overridable at run time:
#   dbt build --vars '{exclude_closed_lost: true}'
vars:
  # The scoring window. 2025 + 2026 is Jan-2025 .. Apr-2026 -- 16 months, and
  # the SAME 16 months for every store, which is what makes it valid to rank on.
  # It is NOT valid for year-on-year comparison: 2026 holds four months and 2025
  # holds twelve. Momentum needs month grain in extract_market.py first.
  market_window_years: [2025, 2026]

  # Closed Won is always excluded -- they are already customers, there is
  # nothing to "approach". Closed Lost is a judgement call, and the client's is
  # to keep them in the mix rather than drop them: a previous loss is harder
  # work than a live prospect, but a lost account that demonstrably buys
  # premium-tier gin is still a better call than an open prospect that buys
  # none. Flip to true to drop them from the universe entirely instead.
  exclude_closed_lost: false

  # Materiality floor, USD, on premium-tier gin over the scoring window. Below
  # this, an account has not proven a premium shelf -- it has proven a curious
  # customer. $600 is roughly a case and a half of premium gin across sixteen
  # months, and it is where this CRM's evidence stops being a signal: the
  # accounts underneath it bought $65-$261, which is a handful of bottles.
  # Sub-floor accounts are NOT dropped -- they fall to tier 2 and are re-ranked
  # on their total gin spend, which is the honest measure of what they can move.
  # Raise it to tighten tier 1, set it to 0 to score any premium gin at all.
  premium_gin_materiality_floor: 600

  # How that "harder work" is expressed. Closed Lost accounts sort to the bottom
  # of their own evidence tier -- demoted, not deleted. Deliberately a boolean
  # and not a numeric weight: a tier demotion is a statement of precedence
  # anyone can check by eye, whereas "multiply by 0.6" is a number someone has
  # to justify. Set to false to rank previous losses on market evidence alone.
  demote_closed_lost: true

  # How many rows get flagged as the deliverable. The mart scores every
  # eligible store; this only sets the is_top_target flag, so answering
  # "who is number 26?" never requires a rebuild.
  target_list_size: 25
