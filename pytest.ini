# Without this, `pytest` from the repo root fails on `from extract import config`.
# pytest's default prepend import mode puts the test file's own directory on
# sys.path -- tests/ here, since it is not a package -- so the project root, and
# with it the `extract` package, is never importable. `python -m pytest` happens
# to work because -m adds the cwd, but the README should not depend on that.
[pytest]
pythonpath = .
testpaths = tests
